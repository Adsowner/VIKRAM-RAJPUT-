<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b1a">
<title>Vikram Rajput | Join Channel</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;color:#f3fffb;background:radial-gradient(circle at 15% 15%,#14534b 0,transparent 34%),radial-gradient(circle at 85% 85%,#173b61 0,transparent 35%),linear-gradient(135deg,#061513,#081a25 55%,#07111c)}
.card{width:min(430px,100%);padding:38px 27px 32px;text-align:center;border-radius:30px;background:linear-gradient(150deg,#102c2bdf,#102033e8);border:1px solid #8de5ca35;box-shadow:0 28px 90px #0009,0 0 45px #42d6ae12}
.avatar-ring{width:164px;height:164px;margin:0 auto 23px;padding:5px;border-radius:50%;background:linear-gradient(135deg,#9fffe0,#37c6ad,#4e91dc);box-shadow:0 0 35px #47d8b33d}
.avatar{width:100%;height:100%;display:block;object-fit:cover;object-position:center 25%;border-radius:50%;border:4px solid #10221f}
.tag{display:inline-block;padding:8px 14px;border:1px solid #8de5ca55;border-radius:30px;color:#a8f5dd;background:#48d1aa12;font-size:10px;font-weight:800;letter-spacing:2px}
h1{margin:18px 0 10px;font-size:clamp(30px,8vw,39px);letter-spacing:1.5px}
.rule{height:2px;width:52px;margin:0 auto 22px;border-radius:5px;background:linear-gradient(90deg,#6ce7c2,#75b8ff)}
p{margin:0 auto 28px;max-width:310px;color:#b6c9c9;line-height:1.7;font-size:14px}
.join{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:17px 18px;border-radius:15px;text-decoration:none;color:#06201b;font-size:14px;font-weight:900;letter-spacing:.6px;background:linear-gradient(110deg,#9af4d5,#4fc9b1 55%,#83c9ff);box-shadow:0 12px 30px #45d2b52e;transition:.2s}
.join:hover{transform:translateY(-3px);box-shadow:0 16px 38px #45d2b54a}
.join span{font-size:19px}
.foot{margin-top:24px;color:#7f9a9a;font-size:11px;letter-spacing:1.5px}
</style>
</head>
<body>
<main class="card">
  <div class="avatar-ring"><img class="avatar" src="assets/vikram-rajput.jpg" alt="Vikram Rajput"></div>
  <span class="tag">OFFICIAL TELEGRAM CHANNEL</span>
  <h1>VIKRAM RAJPUT</h1>
  <div class="rule"></div>
  <p>Cricket updates aur latest jaankari ke liye hamare Telegram channel se judein.</p>
  <a class="join" href="https://t.me/+bUxiDrFyJZo5YTQ1" target="_blank" rel="noopener"><span>✈</span> JOIN TELEGRAM CHANNEL</a>
  <div class="foot">WELCOME TO THE CHANNEL</div>
</main>
</body>
</html>
