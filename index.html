  <meta name="description" content="Vikram Rajput official Telegram channel. Join for cricket updates.">
  <title>Vikram Rajput | Official Telegram Channel</title>
  <style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;
  color:#f4fffc;font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(ellipse at 12% 12%,#237c70 0,transparent 38%),
  radial-gradient(ellipse at 88% 86%,#286da0 0,transparent 40%),
  linear-gradient(135deg,#06131a,#0a202b 55%,#081421)}
  .card{width:min(440px,100%);padding:36px 27px 30px;text-align:center;
  border:1px solid #96f1da3b;border-radius:30px;
  background:linear-gradient(150deg,#113537f0,#0d232fe8);
  box-shadow:0 28px 90px #0009,0 0 55px #59dcbe14;backdrop-filter:blur(14px)}
  .avatar-ring{width:166px;height:166px;margin:0 auto 22px;padding:5px;border-radius:50%;
  background:linear-gradient(135deg,#c0ffe9,#4ac9b2 52%,#70bfff);
  box-shadow:0 0 38px #5bdcbe40}
  .avatar{display:block;width:100%;height:100%;object-fit:cover;object-position:center 25%;
  border:4px solid #102a2d;border-radius:50%}
  .tag{display:inline-block;padding:8px 14px;color:#aaf7df;background:#5adcba14;
  border:1px solid #8cf0d259;border-radius:30px;font-size:10px;font-weight:800;letter-spacing:2px}
  h1{margin:18px 0 10px;font-size:clamp(30px,8vw,40px);letter-spacing:1.4px}
  .divider{width:54px;height:2px;margin:0 auto 21px;border-radius:4px;
  background:linear-gradient(90deg,#8cf0d2,#75c9ff)}
  .intro{max-width:315px;margin:0 auto 26px;color:#b4c9d0;font-size:14px;line-height:1.75}
  .join{display:flex;width:100%;min-height:56px;align-items:center;justify-content:center;gap:11px;
  padding:16px 18px;color:#06221d;background:linear-gradient(110deg,#a5f8df,#55d1b7 56%,#8bcfff);
  border:0;border-radius:15px;box-shadow:0 12px 30px #45d2b533;text-decoration:none;
  font-size:14px;font-weight:900;letter-spacing:.5px;cursor:pointer;transition:.2s}
  .join:hover{transform:translateY(-3px);box-shadow:0 16px 38px #45d2b552}
  .join:focus-visible{outline:3px solid white;outline-offset:4px}
  .foot{margin-top:23px;color:#88a5aa;font-size:10px;letter-spacing:1.7px}
  @media(max-width:360px){.card{padding:30px 19px 26px}.avatar-ring{width:145px;height:145px}.join{font-size:12px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar-ring"><img class="avatar" src="assets/vikram-rajput.jpg" alt="Vikram Rajput profile photo"></div>
    <span class="tag">OFFICIAL TELEGRAM CHANNEL</span>
    <h1>VIKRAM RAJPUT</h1>
    <div class="divider"></div>
    <p class="intro">Cricket updates aur latest jaankari ke liye hamare Telegram channel se judein.</p>
    <a id="telegramJoinButton" class="join"
       href="https://t.me/+bUxiDrFyJZo5YTQ1" target="_blank" rel="noopener noreferrer">
       <span aria-hidden="true">✈</span> JOIN / SUBSCRIBE NOW
    </a>
    <div class="foot">WELCOME TO THE CHANNEL</div>
  </main>
  <script>
  (function(){
    var button=document.getElementById('telegramJoinButton');
    if(!button)return;
    button.addEventListener('click',function(){
      if(typeof window.fbq==='function'){
        // Standard Meta event
        window.fbq('track','Subscribe',{content_name:'Vikram Rajput Telegram Channel'});
        // Custom Meta event
        window.fbq('trackCustom','JoinTelegram',{channel:'Vikram Rajput',destination:'Telegram'});
      }
    });
  })();
  </script>
</body>
